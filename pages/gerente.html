<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>

        Maxi Checklist - Gerente

    </title>

    <link
        rel="stylesheet"
        href="../style/style-gerente.css">
    
    <link
    rel="icon"
    href="../assets/favicon.ico"
    type="image/x-icon">    

</head>

<body>

<header class="app-header">

    <div class="logo-area">

        <img
            src="../assets/logo.png"
            alt="Logo">

        <div>

            <h1>

                Maxi Checklist

            </h1>

            <span>

                Sistema Inteligente de Auditoria

            </span>

        </div>

    </div>

</header>

<div class="container">

    <div class="barra-topo">

        <select id="filtroData">

            <option value="hoje">

                Hoje

            </option>

            <option value="ontem">

                Ontem

            </option>

            <option value="7dias">

                Últimos 7 dias

            </option>

            <option value="todos">

                Todos

            </option>

        </select>

        <button
            id="btnAtualizar"
            class="btn">

            Atualizar

        </button>

        <button
            id="btnResetSenha"
            class="btn btn-secundario">

            Reset Senha

        </button>

        <button
            id="btnLogout"
            class="btn btn-perigo">

            Sair

        </button>

    </div>

    <h2>

        ✓ Checklists Enviados

    </h2>

    <div id="listaChecklists">

        Carregando...

    </div>

</div>

<!-- MODAL DETALHES -->

<div
    id="modalDetalhes"
    class="modal">

    <div class="modal-content modal-grande">

        <h2>

            Detalhes do Checklist

        </h2>

        <div id="conteudoDetalhes">

        </div>

        <div class="modal-footer">

    <button
        id="fecharDetalhes"
        class="btn btn-perigo">

        Fechar

    </button>

</div>

    </div>

</div>

<!-- MODAL RESET SENHA -->

<div
    id="modalResetSenha"
    class="modal">

    <div class="modal-content">

        <h2>

            Resetar Senha

        </h2>

        <select id="funcionarioReset">

        </select>

        <div class="modal-buttons">

            <button
                id="confirmarReset"
                class="btn">

                Resetar para 123456

            </button>

            <button
                id="fecharReset"
                class="btn btn-secundario">

                Fechar

            </button>

        </div>

    </div>

</div>

<!-- MODAL FOTO -->

<div
    id="modalFoto"
    class="modal">

    <div class="modal-content modal-foto">

        <span
            id="fecharFoto"
            class="fechar-modal">

            ✕

        </span>

        <img
            id="imagemModal"
            src=""
            alt="Foto do Checklist">

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="../js/gerente-auth.js"></script>

<script src="../js/gerente-load.js"></script>

<script src="../js/gerente-details.js"></script>

<script src="../js/gerente-pdf.js"></script>

<script src="../js/gerente-password.js"></script>

<script src="../js/gerente.js"></script>

</body>

</html>
