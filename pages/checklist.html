<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checklist Diário</title>

    <link rel="stylesheet"
          href="../style/style-checklist.css">

</head>

<body>

<div class="container">

    <div class="checklist-card">

        <h1 id="nomeFuncionario">
            Funcionário
        </h1>

        <h3 id="cargoFuncionario">
            Cargo
        </h3>

        <div class="progresso-container">

            <div class="progresso-info">

                <strong>
                    Progresso:
                </strong>

            </div>

            <div class="barra">

                <div id="barraProgresso"></div>

                <span id="textoProgresso">
                    0%
                </span>

            </div>

        </div>

        <div id="listaChecklist"></div>

        <div class="extras">

            <div class="campo">

               <label>

    <strong>

        Alguma observação importante sobre o turno?

    </strong>

    </label>

        <textarea
            id="observacoes"
            rows="5"
            placeholder="Digite aqui qualquer observação importante sobre o turno...">
        </textarea>

            </div>
        </div>

        <div class="botoes-final">

            <button id="btnEnviar">
                Enviar
            </button>

            <button id="btnSenha">
                Atualizar Senha
            </button>

            <button id="btnLogout">
                Sair
            </button>

        </div>

    </div>

</div>

<!-- MODAL SENHA -->

<div id="modalSenha" class="modal">

    <div class="modal-content">

        <h2>
            Atualizar Senha
        </h2>

        <input
            type="password"
            id="senhaAtual"
            placeholder="Senha atual">

        <input
            type="password"
            id="novaSenha"
            placeholder="Nova senha">

        <input
            type="password"
            id="confirmarSenha"
            placeholder="Confirmar nova senha">

        <div class="modal-buttons">

            <button id="salvarSenha">
                Salvar
            </button>

            <button id="fecharSenha">
                Cancelar
            </button>

        </div>

    </div>

</div>

<!-- MODAL CAMERA -->

<div id="cameraContainer">

    <div class="modal-content">

        <video
            id="camera"
            autoplay
            playsinline>
        </video>

        <canvas
            id="canvas"
            style="display:none;">
        </canvas>

        <button id="btnCapturar">
            Tirar Foto
        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>

<script src="../data/checklists.js"></script>

<script src="../js/checklist-auth.js"></script>

<script src="../js/checklist-render.js"></script>

<script src="../js/checklist-progress.js"></script>

<script src="../js/fotos.js"></script>

<script src="../js/checklist-save.js"></script>

<script src="../js/checklist-validate.js"></script>

<script src="../js/checklists.js"></script>

<script src="../js/checklist-password.js"></script>

</body>

</html>
