<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>

        Maxi Checklist

    </title>

    <link
        rel="stylesheet"
        href="../style/style-checklist.css">

    <link
    rel="icon"
    href="../assets/favicon.ico"
    type="image/x-icon">    

</head>

<body>

<header class="app-header">

    <div class="logo-area">

        <img
            src="../assets/logo.png"
            alt="Logo">

        <div>

            <h1>

                Maxi Checklist

            </h1>

            <span>

                Sistema Inteligente de Auditoria

            </span>

        </div>

    </div>

</header>

<div class="container">

    <div class="checklist-card">

        <h1 id="nomeFuncionario">

            Funcionário

        </h1>

        <h3 id="cargoFuncionario">

            Cargo

        </h3>

        <div class="progresso-container">

            <div class="progresso-info">

                <strong>

                    Progresso

                </strong>

            </div>

            <div class="barra">

                <div id="barraProgresso"></div>

                <span id="textoProgresso">

                    0%

                </span>

            </div>

        </div>

        <div id="listaChecklist"></div>

        <div class="extras">

            <div class="campo">

                <label>

                    <strong>

                        Alguma observação importante sobre o turno?

                    </strong>

                </label>

                <textarea
                    id="observacoes"
                    rows="5"
                    placeholder="Digite aqui qualquer observação importante sobre o turno..."></textarea>

            </div>

        </div>

        <div class="botoes-final">

            <button
                id="btnEnviar"
                class="btn">

                Enviar

            </button>

            <button
                id="btnSenha"
                class="btn btn-secundario">

                Atualizar Senha

            </button>

            <button
                id="btnLogout"
                class="btn btn-perigo">

                Sair

            </button>

        </div>

    </div>

</div>

<!-- MODAL SENHA -->

<div
    id="modalSenha"
    class="modal">

    <div class="modal-content">

        <h2>

            Atualizar Senha

        </h2>

        <input
            type="password"
            id="senhaAtual"
            placeholder="Senha atual">

        <br><br>

        <input
            type="password"
            id="novaSenha"
            placeholder="Nova senha">

        <br><br>

        <input
            type="password"
            id="confirmarSenha"
            placeholder="Confirmar nova senha">

        <div class="modal-buttons">

            <button
                id="salvarSenha"
                class="btn">

                Salvar

            </button>

            <button
                id="fecharSenha"
                class="btn btn-secundario">

                Cancelar

            </button>

        </div>

    </div>

</div>

<!-- MODAL CÂMERA -->

<div
    id="cameraContainer"
    class="modal">

    <div class="modal-content">

        <video
            id="camera"
            autoplay
            playsinline>
        </video>

        <canvas
            id="canvas"
            style="display:none;">
        </canvas>

        <button
            id="btnCapturar"
            class="btn">

            📷 Capturar Foto

        </button>

    </div>

</div>

<!-- LOADING -->

<div
    id="loadingScreen"
    class="loading-screen">

    <div class="loading-card">

        <img
            src="../assets/mascote-loading.png"
            alt="Mascote">

        <h2>

            Enviando Checklist...

        </h2>

        <p>

            Aguarde enquanto sincronizamos os dados.

        </p>

        <div class="loading-bar">

            <div class="loading-progress">

            </div>

        </div>

    </div>

</div>

<!-- SUCESSO -->

<div
    id="successScreen"
    class="success-screen">

    <div class="success-card">

        <img
            src="../assets/mascote-success.png"
            alt="Mascote">

        <h2>

            Checklist enviado!

        </h2>

        <p id="textoSucesso">

            Obrigado pelo seu excelente trabalho.

        </p>

        <div class="success-loading">

            <span></span>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>

<script src="../data/checklists.js"></script>

<script src="../js/checklist-auth.js"></script>

<script src="../js/checklist-render.js"></script>

<script src="../js/checklist-progress.js"></script>

<script src="../js/fotos.js"></script>

<script src="../js/ui.js"></script>

<script src="../js/success.js"></script>

<script src="../js/checklist-save.js"></script>

<script src="../js/checklist-validate.js"></script>

<script src="../js/checklists.js"></script>

<script src="../js/checklist-password.js"></script>

</body>

</html>
