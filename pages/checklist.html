<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checklist Diário</title>

    <link rel="stylesheet"
          href="../style/style-checklist.css">

</head>

<body>

<div class="container">

    <div class="checklist-card">

        <h1 id="nomeFuncionario">
            Funcionário
        </h1>

        <h3 id="cargoFuncionario">
            Cargo
        </h3>

        <div class="progresso-container">

            <div class="progresso-info">

                <strong>
                    Progresso:
                </strong>

            </div>

            <div class="barra">

                <div id="barraProgresso"></div>

                <span id="textoProgresso">
                    0%
                </span>

            </div>

        </div>

        <div id="listaChecklist">

        </div>

        <div class="extras">

            <div class="campo">

                <label>
                    Observações Gerais
                </label>

                <textarea
                    id="observacoes"
                    rows="5"
                    placeholder="Digite observações do turno..."></textarea>

            </div>

        </div>

        <div class="botoes-final">

            <button id="btnEnviar">
                Enviar
            </button>

            <button id="btnSenha">
                Atualizar Senha
            </button>

            <button id="btnLogout">
                Sair
            </button>

        </div>

    </div>

</div>

<div id="modalSenha" class="modal">

    <div class="modal-content">

        <h2>
            Atualizar Senha
        </h2>

        <input
            type="password"
            id="senhaAtual"
            placeholder="Senha atual">

        <input
            type="password"
            id="novaSenha"
            placeholder="Nova senha">

        <input
            type="password"
            id="confirmarSenha"
            placeholder="Confirmar nova senha">

        <div class="modal-buttons">

            <button id="salvarSenha">
                Salvar
            </button>

            <button id="fecharSenha">
                Cancelar
            </button>

        </div>

    </div>

</div>

<div id="cameraContainer" style="display:none;">

    <video
        id="camera"
        autoplay
        playsinline
        width="100%"
        style="border-radius:20px;">
    </video>

    <canvas
        id="canvas"
        style="display:none;">
    </canvas>

    <button id="btnCapturar">
        Tirar Foto
    </button>

    <button id="btnCancelarFoto">
        Cancelar
    </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>

<script src="../data/checklists.js"></script>

<script src="../js/fotos.js"></script>

<script src="../js/checklists.js"></script>

</body>

</html>
