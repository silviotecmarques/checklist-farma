<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>

        BellariaChecklist

    </title>

    <link
        rel="stylesheet"
        href="style/style-login.css">

    <link
    rel="icon"
    href="assets/favicon.ico"
    type="image/x-icon">    

</head>

<body>

    <div class="login-container">

        <div class="login-card fade-in">

            <img
                src="assets/logo.png"
                class="logo"
                alt="Logo Bellaria Tech">

            <h1>

                Checklist

            </h1>

            <div class="form-group">

                <label>

                    Funcionário

                </label>

                <select id="funcionario">

                    <option value="">

                        Selecione...

                    </option>

                </select>

            </div>

            <div class="form-group">

                <label>

                    Senha

                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha">

            </div>

            <button
                id="btnLogin"
                class="btn">

                Entrar

            </button>

            <hr>

            <button
                id="btnGerente"
                class="btn gerente-btn">

                Acesso Gerencial

            </button>

            <p id="mensagem"></p>

            <div class="footer-login">

                Powered by
                <strong>Bellaria Tech</strong>

            </div>

        </div>

    </div>

    <!-- MODAL GERENTE -->

    <div
        id="modalGerente"
        class="modal">

        <div class="modal-content">

            <h2>

                Acesso Gerencial

            </h2>

            <input
                type="password"
                id="senhaGerente"
                placeholder="Digite a senha do gerente">

            <div class="modal-buttons">

                <button
                    id="btnEntrarGerente"
                    class="btn">

                    Entrar

                </button>

                <button
                    id="btnFecharModal"
                    class="btn btn-secundario">

                    Cancelar

                </button>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script src="js/auth.js"></script>

</body>

</html>
